server {
    listen 443 ssl;
    listen 80;
    server_name vibe.198107.xyz;
    server_name token.sensenova.cn;

    ssl_certificate /etc/letsencrypt/live/198107.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/198107.xyz/privkey.pem;

    client_max_body_size 50M;

    root /root/Vibe-Research/desktop/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header Authorization "Bearer 1bcffcb1160ca6b6e12408b9fe974975bec0ee4b665bc003";
        # 归一化跨站头：后端 crossSiteReject 只认本机 Origin + Sec-Fetch-Site 同域。
        # 否则浏览器公网 Origin 被原样透传 -> 403 forbidden_origin。
        # 等价 Vite dev 行为见 desktop/vite.config.ts:72。
        proxy_set_header Origin "http://127.0.0.1:5930";
        proxy_set_header Sec-Fetch-Site "same-origin";
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }

    # HTML: 不缓存（前端更新立即可见）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # JS/CSS: 带 hash 文件名，可长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
